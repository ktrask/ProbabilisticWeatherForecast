# yaml-language-server: $schema=sources.schema.json
#
# Offline stand-in for sources.yaml: the same products, served from the
# recorded forecasts - ECMWF in tests/fixtures/, each other product in its own
# directory below it (Braunschweig, Reykjavik, Singapore, Zermatt, Alice
# Springs, as far as a regional model covers them - a request is answered from
# the nearest one within half a degree). The regional areas are the live ones. No network, and the same answer every time, which is what
# the API tests and the frontend's screenshot tests need.
#
#   SOURCES_CONFIG=config/sources.fixtures.yaml python -m api serve

version: 1

sources:
  recorded:
    adapter: fixture
    directory: ../tests/fixtures
  recorded-icon:
    adapter: fixture
    directory: ../tests/fixtures/icon_eps
  recorded-aifs:
    adapter: fixture
    directory: ../tests/fixtures/aifs
  recorded-gfs:
    adapter: fixture
    directory: ../tests/fixtures/gfs
  recorded-aigefs:
    adapter: fixture
    directory: ../tests/fixtures/aigefs
  recorded-gem:
    adapter: fixture
    directory: ../tests/fixtures/gem
  recorded-icon-eu:
    adapter: fixture
    directory: ../tests/fixtures/icon_eu_eps
    area: {south: 29.5, north: 70.5, west: -23.5, east: 62.5}
  recorded-icon-d2:
    adapter: fixture
    directory: ../tests/fixtures/icon_d2_eps
    area: {south: 43.18, north: 58.06, west: -3.94, east: 20.32}
  recorded-meteoswiss:
    adapter: fixture
    directory: ../tests/fixtures/meteoswiss_ch2
    area: {south: 42.58, north: 49.79, west: 1.23, east: 16.85}

products:
  ecmwf:
    label: ECMWF ensemble (recorded)
    ensemble: recorded
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 51
    grid_km: 25
    horizon_days: 15
  icon:
    label: DWD ICON ensemble (recorded)
    ensemble: recorded-icon
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 40
    grid_km: 26
    horizon_days: 7.5
  aifs:
    label: ECMWF AIFS ensemble (AI) (recorded)
    ensemble: recorded-aifs
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 51
    grid_km: 25
    horizon_days: 15
    automatic: false
  gfs:
    label: NOAA GFS ensemble (recorded)
    ensemble: recorded-gfs
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 31
    grid_km: 25  # 0.25 degrees for 10 days, then 0.5
    horizon_days: 16
    automatic: false
  aigefs:
    label: NOAA AI-GEFS ensemble (AI) (recorded)
    ensemble: recorded-aigefs
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 31
    grid_km: 25
    horizon_days: 16
    automatic: false
  gem:
    label: CMC GEM ensemble (recorded)
    ensemble: recorded-gem
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 21
    grid_km: 25
    horizon_days: 16
    automatic: false
  icon-eu:
    label: DWD ICON-EU ensemble (recorded)
    ensemble: recorded-icon-eu
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 40
    grid_km: 13
    horizon_days: 5
  icon-d2:
    label: DWD ICON-D2 ensemble (recorded)
    # Hourly by default: two days in 6-hour steps are too few to read. ICON-D2
    # and ICON-CH2 compute every hour over their whole run; ICON-EU and the
    # global ICON only for about two days, ECMWF every 3 hours - checked on
    # 2026-10-01 (docs/modelle-plan.md, stage 4), so they stay at 6 hours.
    steps: [1, 6]
    ensemble: recorded-icon-d2
    schemes: [cloud-vsup, precipitation-vsup, precipitation-1h-vsup, wind-vsup]
    members: 20
    grid_km: 2
    horizon_days: 2
  meteoswiss:
    label: MeteoSwiss ICON-CH2 ensemble (recorded)
    ensemble: recorded-meteoswiss
    schemes: [cloud-vsup, precipitation-vsup, precipitation-1h-vsup, wind-vsup]
    members: 21
    grid_km: 2
    horizon_days: 5
    steps: [6, 1]
