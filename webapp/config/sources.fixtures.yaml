# yaml-language-server: $schema=sources.schema.json
#
# Offline stand-in for sources.yaml: the same products, served from the
# recorded forecasts - ECMWF in tests/fixtures/, each other product in its own
# directory below it (Braunschweig, Reykjavik, Singapore, Zermatt, Alice
# Springs, as far as a regional model covers them - a request is answered from
# the nearest one within half a degree). The regional areas are the live ones. No network, and the same answer every time, which is what
# the API tests and the frontend's screenshot tests need.
#
#   SOURCES_CONFIG=config/sources.fixtures.yaml python -m api serve

version: 1

sources:
  recorded:
    adapter: fixture
    directory: ../tests/fixtures
  recorded-icon:
    adapter: fixture
    directory: ../tests/fixtures/icon_eps
  recorded-icon-eu:
    adapter: fixture
    directory: ../tests/fixtures/icon_eu_eps
    area: {south: 29.5, north: 70.5, west: -23.5, east: 62.5}
  recorded-icon-d2:
    adapter: fixture
    directory: ../tests/fixtures/icon_d2_eps
    area: {south: 43.18, north: 58.06, west: -3.94, east: 20.32}
  recorded-meteoswiss:
    adapter: fixture
    directory: ../tests/fixtures/meteoswiss_ch2
    area: {south: 42.58, north: 49.79, west: 1.23, east: 16.85}

products:
  ecmwf:
    label: ECMWF ensemble (recorded)
    ensemble: recorded
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 51
    grid_km: 25
    horizon_days: 15
  icon:
    label: DWD ICON ensemble (recorded)
    ensemble: recorded-icon
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 40
    grid_km: 26
    horizon_days: 7.5
  icon-eu:
    label: DWD ICON-EU ensemble (recorded)
    ensemble: recorded-icon-eu
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 40
    grid_km: 13
    horizon_days: 5
  icon-d2:
    label: DWD ICON-D2 ensemble (recorded)
    # Not chosen automatically before it is shown in hourly steps (stage 4 of
    # docs/modelle-plan.md): two days in 6-hour steps are too few to read.
    automatic: false
    ensemble: recorded-icon-d2
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 20
    grid_km: 2
    horizon_days: 2
  meteoswiss:
    label: MeteoSwiss ICON-CH2 ensemble (recorded)
    ensemble: recorded-meteoswiss
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 21
    grid_km: 2
    horizon_days: 5
