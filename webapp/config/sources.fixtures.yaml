# yaml-language-server: $schema=sources.schema.json
#
# Offline stand-in for sources.yaml: the same products, served from the
# recorded forecasts - ECMWF in tests/fixtures/, ICON in tests/fixtures/icon_eps/
# (Braunschweig, Reykjavik, Singapore, Zermatt, Alice Springs - a request is
# answered from the nearest one within half a degree). No network, and the same answer every time, which is what
# the API tests and the frontend's screenshot tests need.
#
#   SOURCES_CONFIG=config/sources.fixtures.yaml python -m api serve

version: 1

sources:
  recorded:
    adapter: fixture
    directory: ../tests/fixtures
  recorded-icon:
    adapter: fixture
    directory: ../tests/fixtures/icon_eps

products:
  ecmwf:
    label: ECMWF ensemble (recorded)
    ensemble: recorded
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 51
    grid_km: 25
    horizon_days: 15
  icon:
    label: DWD ICON ensemble (recorded)
    ensemble: recorded-icon
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 40
    grid_km: 26
    horizon_days: 7.5
