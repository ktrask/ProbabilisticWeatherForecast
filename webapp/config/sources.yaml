# yaml-language-server: $schema=sources.schema.json
#
# Where forecasts come from, and the products the UI offers. Checked against
# vsup.yaml on load - run `python -m sources check` after editing.
#
# A source is an adapter plus its settings. A product ties an ensemble source
# to the VSUP schemes drawn from it, and says what the reader picks between:
# members, grid spacing and range. The first product is the default.
#
# For offline development and tests, sources.fixtures.yaml serves the recorded
# forecasts in tests/fixtures/ under the same product name.

version: 1

sources:
  ecmwf-ens:
    adapter: open_meteo_ensemble
    model: ecmwf_ifs025
    forecast_days: 15
    timeout_s: 30
  # DWD's global ICON ensemble. Not icon_seamless_eps: that one switches to
  # the finer EU grid inside Europe, which ICON-EU will be as its own product.
  icon-eps:
    adapter: open_meteo_ensemble
    model: icon_global_eps
    forecast_days: 8
    timeout_s: 30
  # Further global ensembles, chosen by hand only (automatic: false below): two
  # of them reach 16 days, one more than ECMWF, and would take long views over.
  # The AI models (AIFS, AI-GEFS) compute every 6 hours on 00/06/12/18 UTC, the
  # others every 3; a 6-hour window from local midnight that does not start on
  # their grid blends two of their steps (checked 2026-10-01, modelle-plan.md).
  aifs-ens:
    adapter: open_meteo_ensemble
    model: ecmwf_aifs025
    forecast_days: 16
    timeout_s: 30
  gfs-ens:
    adapter: open_meteo_ensemble
    model: gfs_seamless
    forecast_days: 16
    timeout_s: 30
  aigefs-ens:
    adapter: open_meteo_ensemble
    model: ncep_aigefs025
    forecast_days: 16
    timeout_s: 30
  gem-ens:
    adapter: open_meteo_ensemble
    model: gem_global
    forecast_days: 16
    timeout_s: 30
  # Regional models: each covers only its area. The boxes are Open-Meteo's
  # own (its domain metadata); ICON-EU and -D2 fill them, MeteoSwiss's rotated
  # grid does not, and there the model's answer decides.
  icon-eu-eps:
    adapter: open_meteo_ensemble
    model: icon_eu_eps
    forecast_days: 6
    timeout_s: 30
    area: {south: 29.5, north: 70.5, west: -23.5, east: 62.5}
  icon-d2-eps:
    adapter: open_meteo_ensemble
    model: icon_d2_eps
    forecast_days: 3
    timeout_s: 30
    area: {south: 43.18, north: 58.06, west: -3.94, east: 20.32}
  meteoswiss-ch2:
    adapter: open_meteo_ensemble
    model: meteoswiss_icon_ch2
    forecast_days: 6
    timeout_s: 30
    area: {south: 42.58, north: 49.79, west: 1.23, east: 16.85}

products:
  ecmwf:
    label: ECMWF ensemble
    ensemble: ecmwf-ens
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 51
    grid_km: 25
    horizon_days: 15
  icon:
    label: DWD ICON ensemble
    ensemble: icon-eps
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 40
    grid_km: 26
    horizon_days: 7.5
  aifs:
    label: ECMWF AIFS ensemble (AI)
    ensemble: aifs-ens
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 51
    grid_km: 25
    horizon_days: 15
    automatic: false
  gfs:
    label: NOAA GFS ensemble
    ensemble: gfs-ens
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 31
    grid_km: 25  # 0.25 degrees for 10 days, then 0.5
    horizon_days: 16
    automatic: false
  aigefs:
    label: NOAA AI-GEFS ensemble (AI)
    ensemble: aigefs-ens
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 31
    grid_km: 25
    horizon_days: 16
    automatic: false
  gem:
    label: CMC GEM ensemble
    ensemble: gem-ens
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 21
    grid_km: 25
    horizon_days: 16
    automatic: false
  icon-eu:
    label: DWD ICON-EU ensemble
    ensemble: icon-eu-eps
    schemes: [cloud-vsup, precipitation-vsup, wind-vsup]
    members: 40
    grid_km: 13
    horizon_days: 5
  icon-d2:
    label: DWD ICON-D2 ensemble
    # Hourly by default: two days in 6-hour steps are too few to read. ICON-D2
    # and ICON-CH2 compute every hour over their whole run; ICON-EU and the
    # global ICON only for about two days, ECMWF every 3 hours - checked on
    # 2026-10-01 (docs/modelle-plan.md, stage 4), so they stay at 6 hours.
    steps: [1, 6]
    ensemble: icon-d2-eps
    schemes: [cloud-vsup, precipitation-vsup, precipitation-1h-vsup, wind-vsup]
    members: 20
    grid_km: 2
    horizon_days: 2
  meteoswiss:
    label: MeteoSwiss ICON-CH2 ensemble
    ensemble: meteoswiss-ch2
    schemes: [cloud-vsup, precipitation-vsup, precipitation-1h-vsup, wind-vsup]
    members: 21
    grid_km: 2
    horizon_days: 5
    steps: [6, 1]
