{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf%}
{% block content %}
{{super()}}
<div class="container">
  <div class="row">
    <div class="col-sm-3">
    </div>
    <div class="col-sm-6">
      {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
      {% endif %}
      {{ wtf.quick_form(form, action="search", method="get") }}
    </div>
    <div class="col-sm-3">
    </div>
  </div>
</div>
{% endblock %}
